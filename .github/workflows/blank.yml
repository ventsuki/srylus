name: Build and publish website

on:
  # schedule:
  #    #Build once per day, at 03:15 UTC
  #   - cron: "15 3 * * *"

  workflow_dispatch:

# added perms to make sure
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: clone fmhy
        run: |
          git clone --depth 1 --branch main \
            https://github.com/fmhy/edit.git/ \
            "$RUNNER_TEMP/site"
   
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/site
        run: |
          pnpm install --frozen-lockfile
        
      - name: Build FMHY website
        working-directory: ${{ runner.temp }}/site
        run: |
          pnpm docs:build --base /
          ls "$RUNNER_TEMP/docs/.vitepress"

      ### removed copying as unnecessary step - also redirects

      # - name: Copy generated files into deployment directory
      #   working-directory: ${{ runner.temp }}/site
      #   run: |
      #     rm -rf _site
      #     mkdir -p _site
      #     cp -a docs/.vitepress/dist _site

       
       # This redirect is used by the www deployment below.
      # - name: Add www-to-apex redirect
      #   working-directory: site
      #   run: |
      #     printf '%s\n' \
      #       '//www.fmhy.vencat.dev/* https://fmhy.vencat.dev/:splat 301!' \
      #       '//www.vencat.dev/* https://vencat.dev/:splat 301!' \
      #       '//www.vencat.dev/* https://vencat.dev/:splat 301!' \
      #       > _site/_redirects

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site/docs/.vitepress/dist


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
